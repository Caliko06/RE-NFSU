<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>NFSU</title>
<style>
  :root { --bg: #0b0d10; --fg: #c9d1d9; --dim: #6e7681; --ok: #3fb950; --stop: #f85149; --api: #79c0ff; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 ui-monospace, Menlo, monospace; }
  header { padding: 12px 16px; border-bottom: 1px solid #21262d; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header b { font-size: 15px; }
  #status { color: var(--dim); }
  #status.run { color: var(--ok); }
  #status.stop { color: var(--stop); }
  #log { padding: 12px 16px; white-space: pre-wrap; word-break: break-all; margin: 0; }
  #screen { display: block; max-width: 100%; background: #000; margin: 12px 16px 0; }
  .stop { color: var(--stop); font-weight: bold; }
  .api { color: var(--api); }
  .dim { color: var(--dim); }
</style>
</head>
<body>
<header><b>Need for Speed Underground</b><span class="dim">Speed.exe traducido a WebAssembly</span><span id="status">cargando…</span></header>
<canvas id="screen" width="800" height="600"></canvas>
<pre id="log"></pre>
<script src="gpu.js"></script>
<script src="out/speed.js"></script>
<script>
const log = document.getElementById('log'), status = document.getElementById('status');
const t0 = performance.now();
function line(s, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  else if (/^STOP/.test(s)) d.className = 'stop';
  else if (/^  \S+!/.test(s)) d.className = 'api';
  d.textContent = s;
  log.appendChild(d);
  if (/^STOP/.test(s)) { status.textContent = 'detenido a los ' + ((performance.now() - t0) / 1000).toFixed(2) + ' s'; status.className = 'stop'; }
}
(async () => {
  if (!crossOriginIsolated) { line('Falta COOP/COEP: abre la página desde tools/serve.py', 'stop'); return; }
  const exe = new Uint8Array(await (await fetch('pc/Speed.exe')).arrayBuffer());
  // The game folder goes whole into the in-memory file system before the game starts.
  const list = await (await fetch('game-files.json')).json();
  const files = [];
  let got = 0, total = list.reduce((n, f) => n + f[1], 0);
  const load = async f => {
    const data = new Uint8Array(await (await fetch('game/' + f[0].split('/').map(encodeURIComponent).join('/'))).arrayBuffer());
    files.push([f[0], data]);
    got += data.length;
    status.textContent = `cargando game/ ${(got / 2 ** 20).toFixed(0)} de ${(total / 2 ** 20).toFixed(0)} MB`;
  };
  for (let k = 0; k < list.length; k += 8) await Promise.all(list.slice(k, k + 8).map(load));
  status.textContent = 'corriendo'; status.className = 'run';
  const M = await Speed({
    arguments: ['/pc/Speed.exe', '/game'],
    print: s => line(s), printErr: s => line(s, 'dim'),
    preRun: [m => {
      m.FS.mkdir('/pc'); m.FS.writeFile('/pc/Speed.exe', exe); m.FS.mkdir('/game');
      for (const [path, data] of files) {
        const parts = path.split('/');
        for (let k = 1; k < parts.length; k++) { try { m.FS.mkdir('/game/' + parts.slice(0, k).join('/')); } catch {} }
        m.FS.writeFile('/game/' + path, data, { canOwn: true });
      }
      files.length = 0;
    }],
  });
  startGpu(M, document.getElementById('screen'), s => line(s, 'api')).catch(e => line('gpu.js: ' + e.message, 'stop'));
})();
</script>
</body>
</html>
