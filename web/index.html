<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>NFSU</title>
<style>
  :root { --bg: #0b0d10; --fg: #c9d1d9; --dim: #6e7681; --ok: #3fb950; --stop: #f85149; --api: #79c0ff; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 ui-monospace, Menlo, monospace; }
  html, body { height: 100%; overflow: hidden; }
  body.dbg { overflow: auto; }
  header { padding: 12px 16px; border-bottom: 1px solid #21262d; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header b { font-size: 15px; }
  #status { color: var(--dim); }
  #status.run { color: var(--ok); }
  #status.stop { color: var(--stop); }
  #log { padding: 12px 16px; white-space: pre-wrap; word-break: break-all; margin: 0; }
  /* The game fills the window and keeps its aspect; the log is a panel (F2, or at a STOP). */
  #screen { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; background: #000; }
  #panel { display: none; position: fixed; inset: 0; background: rgba(11,13,16,.92); overflow: auto; }
  body.dbg #panel { display: block; }
  .stop { color: var(--stop); font-weight: bold; }
  .api { color: var(--api); }
  .dim { color: var(--dim); }
</style>
</head>
<body>
<canvas id="screen" width="800" height="600"></canvas>
<div id="panel">
<header><b>Need for Speed Underground</b><span class="dim">Speed.exe traducido a WebAssembly · F2 cierra</span><span id="status">cargando…</span></header>
<pre id="log"></pre>
</div>
<script src="gpu.js"></script>
<script src="input.js"></script>
<script src="audio.js"></script>
<script src="telemetry.js"></script>
<script src="tune.js"></script>
<script>
// ?bridge[=url]: a race chosen in this menu opens in the NFSU1-RE engine instead (host/bridge.c). Off by default.
const bridgeTo = new URLSearchParams(location.search).get('bridge');
if (bridgeTo !== null) window.rnBridge = q => { location.href = (bridgeTo && bridgeTo !== '1' ? bridgeTo : `http://${location.hostname}:5190/`) + '?' + q; return 1; };
</script>
<script src="out/speed.js"></script>
<script>
const log = document.getElementById('log'), status = document.getElementById('status');
const t0 = performance.now();
// Everything shown here also goes to tools/serve.py (build/web.log), so a session can be read afterwards.
let pending = [], allLog = [];       // allLog: the whole session, for the F10 download (telemetry.js)
const keep = s => { pending.push(s); allLog.push(s); };
function flush() {
  if (!pending.length) return;
  const body = pending.join('\n') + '\n';
  pending = [];
  fetch('/log', { method: 'POST', body, keepalive: true }).catch(() => {});
}
fetch('/log?new', { method: 'POST', body: `page ${location.href} ${new Date().toISOString()}\n` }).catch(() => {});
setInterval(flush, 1000);
const secs = () => ((performance.now() - t0) / 1000).toFixed(2);
addEventListener('keydown', e => { if (!e.repeat) keep(`${secs()} key down ${e.code}`); }, true);
addEventListener('keyup', e => keep(`${secs()} key up ${e.code}`), true);
addEventListener('error', e => { line('JS error: ' + e.message + ' at ' + e.filename + ':' + e.lineno, 'stop'); flush(); });
addEventListener('unhandledrejection', e => { line('JS rejection: ' + (e.reason && e.reason.stack || e.reason), 'stop'); flush(); });
addEventListener('pagehide', flush);
addEventListener('keydown', e => { if (e.code === 'F2') { document.body.classList.toggle('dbg'); e.preventDefault(); } }, true);
function line(s, cls) {
  keep(`${secs()} ${s}`);
  if (/^STOP|^JS |abort|Aborted|RuntimeError/.test(s)) setTimeout(flush, 0);
  const d = document.createElement('div');
  if (cls) d.className = cls;
  else if (/^STOP/.test(s)) d.className = 'stop';
  else if (/^  \S+!/.test(s)) d.className = 'api';
  d.textContent = s;
  log.appendChild(d);
  if (/^STOP/.test(s)) { document.body.classList.add('dbg'); status.textContent = 'detenido a los ' + ((performance.now() - t0) / 1000).toFixed(2) + ' s'; status.className = 'stop'; }
}
(async () => {
  if (!crossOriginIsolated) { line('Falta COOP/COEP: abre la página desde tools/serve.py', 'stop'); return; }
  const exe = new Uint8Array(await (await fetch('pc/Speed.exe')).arrayBuffer());
  // Game files are read on demand by the game thread (host/files.c), not loaded here.
  status.textContent = 'corriendo'; status.className = 'run';
  const M = await Speed({
    arguments: ['/pc/Speed.exe', '/game'],
    print: s => line(s), printErr: s => line(s, 'dim'),
    onAbort: what => line('STOP wasm abort: ' + what),
    preRun: [m => {
      m.FS.mkdir('/pc'); m.FS.writeFile('/pc/Speed.exe', exe);
      // The game draws at the pixels of this window (PATCH 0x408760), at most 2560x1440 to keep the GPU load sane.
      const dpr = window.devicePixelRatio || 1, k = Math.min(1, 2560 / (innerWidth * dpr), 1440 / (innerHeight * dpr));
      // Even sizes: the layer keeps width and height even (host/win32.c). At k = 1 the canvas gets exactly
      // back buffer / dpr CSS pixels, centred, so one back-buffer pixel is one device pixel; k < 1: Chrome scales it up.
      const bw = 2 * Math.floor(innerWidth * dpr * k / 2), bh = 2 * Math.floor(innerHeight * dpr * k / 2);
      m.ENV.RN_SCREEN = `${bw}x${bh}`;
      if (k === 1) Object.assign(document.getElementById('screen').style, { width: `${bw / dpr}px`, height: `${bh / dpr}px`, margin: 'auto' });
      line(`screen: window ${innerWidth}x${innerHeight} css, dpr ${dpr}, k ${k.toFixed(3)}, back buffer ${m.ENV.RN_SCREEN}`);
      // ?env=RN_TRACE=1,RN_API=Present: the debug switches of the native build
      for (const kv of (new URLSearchParams(location.search).get('env') || '').split(',').filter(Boolean)) {
        const k = kv.indexOf('=');
        m.ENV[k < 0 ? kv : kv.slice(0, k)] = k < 0 ? '1' : kv.slice(k + 1);
      }
    }],
  });
  const telem = startTelemetry(M, t0, s => line(s), allLog);
  startGpu(M, document.getElementById('screen'), s => line(s, 'api'), telem?.frame).catch(e => line('gpu.js: ' + e.message, 'stop'));
  startInput(M, document.getElementById('screen'));
  startTune(M);
  startAudio(M, s => line(s)).catch(e => line('audio.js: ' + e.message, 'stop'));
  window.RN_M = M;                          // for checks from the console or tools/webcheck.mjs
})();
</script>
</body>
</html>
