<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NFSU</title>
<style>
  :root { --bg: #0b0d10; --fg: #c9d1d9; --dim: #6e7681; --ok: #3fb950; --stop: #f85149; --api: #79c0ff; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 ui-monospace, Menlo, monospace; }
  html, body { height: 100%; overflow: hidden; }
  body.dbg { overflow: auto; }
  /* touch: no pan, zoom, double-tap zoom, text selection or long-press callout on the game (web/touch.js draws the controls) */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  body.dbg { -webkit-user-select: text; user-select: text; }
  #screen { touch-action: none; }
  header { padding: 12px 16px; border-bottom: 1px solid #21262d; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header b { font-size: 15px; }
  #status { color: var(--dim); }
  #status.run { color: var(--ok); }
  #status.stop { color: var(--stop); }
  #log { padding: 12px 16px; white-space: pre-wrap; word-break: break-all; margin: 0; }
  /* The game fills the window and keeps its aspect; the log is a panel (F2, or at a STOP). */
  #screen { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; object-fit: contain; background: #000; }
  #panel { display: none; position: fixed; inset: 0; background: rgba(11,13,16,.92); overflow: auto; }
  body.dbg #panel { display: block; }
  .stop { color: var(--stop); font-weight: bold; }
  .api { color: var(--api); }
  .dim { color: var(--dim); }
</style>
</head>
<body>
<canvas id="screen" width="800" height="600"></canvas>
<div id="panel">
<header><b>Need for Speed Underground</b><span class="dim">Speed.exe traducido a WebAssembly · F2 cierra</span><span id="status">cargando…</span></header>
<pre id="log"></pre>
</div>
<script src="launcher_opts.js"></script>
<script>
// Bare / with a saved choice (web/overlay.js, the launcher): play with its keys; web/mode.js reads the mode from storage itself.
if (!location.search) { const q = RN_LAUNCH.query(RN_LAUNCH.load()).split('&').filter(x => x !== 'play=1' && !x.startsWith('mode=')).join('&'); if (q && localStorage.getItem('rn_launch')) location.replace('/?' + q); }
</script>
<script src="mode.js"></script>
<script src="gpu.js"></script>
<script src="input.js"></script>
<script src="binds.js"></script>
<script src="pad.js"></script>
<script src="touch.js"></script>
<script src="audio.js"></script>
<script src="telemetry.js"></script>
<script src="tune.js"></script>
<script>
// ?bridge[=url]: a race chosen in this menu opens in the NFSU1-RE engine instead (host/bridge.c). Off by default.
const bridgeTo = RN_Q.get('bridge');
if (bridgeTo !== null) window.rnBridge = q => { location.href = (bridgeTo && bridgeTo !== '1' ? bridgeTo : `http://${location.hostname}:5190/`) + '?' + q; return 1; };
</script>
<script src="out/speed.js"></script>
<script src="boot.js"></script>
<script src="overlay.js"></script>
<script>
// ?fast=1 (the launcher, proposal A+B): scene B (web/launcher_b) covers the game while it boots (no intro movies or splash, PATCH 0x4de395; the game's own
// Accept loads the profile, web/boot.js). Enter or a click lifts the cover with a 250 ms fade, only once the game reports its main menu (the "flow fe ...MU_Main_PC.fng" log line).
if (RN_Q.get('fast') === '1') {
  const css = document.createElement('style');
  css.textContent = `#ab { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 12; background: #000; pointer-events: none; transition: opacity .25s ease; }
    #ab-msg { position: fixed; left: 0; right: 0; bottom: 8vh; z-index: 13; text-align: center; font: 600 15px system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase;
      color: #ffd9b0; text-shadow: 0 2px 12px #000; pointer-events: none; transition: opacity .25s ease; }
    @media (prefers-reduced-motion: reduce) { #ab, #ab-msg { transition: none; } }`;
  document.head.appendChild(css);
  const ab = Object.assign(document.createElement('iframe'), { id: 'ab', src: '/launcher_b/', tabIndex: -1 }), msg = Object.assign(document.createElement('div'), { id: 'ab-msg', textContent: 'Enter para jugar' });
  document.body.append(ab, msg);
  let ready = false, want = false, gone = false;
  const lift = () => {
    if (gone) return; gone = true; ab.style.opacity = msg.style.opacity = '0';
    setTimeout(() => { ab.remove(); msg.remove(); document.getElementById('screen').focus(); }, 260);
  };
  const press = () => { if (ready) lift(); else { want = true; msg.textContent = 'cargando\u2026'; } };
  new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) {
    const t = n.textContent || '';
    if (/flow fe .*MU_Main_PC\.fng/.test(t)) { ready = true; if (want) lift(); }
    else if (/^STOP|^JS |abort|Aborted/.test(t)) lift();       // an error must show, not hide behind the scene
  } }).observe(document.getElementById('log'), { childList: true });
  // while the cover is up the game gets no keys (Enter lifts it; F keys and K stay)
  addEventListener('keydown', e => {
    if (gone || /^F\d+$/.test(e.code) || e.code === 'KeyK') return;
    e.preventDefault(); e.stopPropagation(); if (e.code === 'Enter' && !e.repeat) press();
  }, true);
  addEventListener('keyup', e => { if (!gone && !/^F\d+$/.test(e.code) && e.code !== 'KeyK') { e.preventDefault(); e.stopPropagation(); } }, true);
  addEventListener('pointerdown', e => { if (!gone && !e.target.closest('#ov, #ov-btn')) { e.preventDefault(); e.stopPropagation(); press(); } }, true);
  window.RN_AB = { get ready() { return ready; }, lift };
}
</script>

</body>
</html>
