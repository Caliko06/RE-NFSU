<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<!-- iPhone Safari has no full screen for a page: added to the home screen, it opens as a web app without the browser bars -->
<link rel="manifest" href="app.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NFS Underground">
<title>Need for Speed Underground</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #0b0d10; --fg: #c9d1d9; --dim: #6e7681; --ok: #3fb950; --stop: #f85149; --api: #79c0ff; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 ui-monospace, Menlo, monospace; }
  html, body { height: 100%; overflow: hidden; }
  body.dbg { overflow: auto; }
  /* touch: no pan, zoom, double-tap zoom, text selection or long-press callout on the game (web/touch.js draws the controls) */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  body.dbg { -webkit-user-select: text; user-select: text; }
  #screen { touch-action: none; }
  header { padding: 12px 16px; border-bottom: 1px solid #21262d; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header b { font-size: 15px; }
  #status { color: var(--dim); }
  #status.run { color: var(--ok); }
  #status.stop { color: var(--stop); }
  #log { padding: 12px 16px; white-space: pre-wrap; word-break: break-all; margin: 0; }
  /* The game fills the window and keeps its aspect; the log is a panel (F2, or at a STOP). */
  #screen { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; object-fit: contain; background: #000; }
  #panel { display: none; position: fixed; inset: 0; background: rgba(11,13,16,.92); overflow: auto; }
  body.dbg #panel { display: block; }
  .stop { color: var(--stop); font-weight: bold; }
  .api { color: var(--api); }
  .dim { color: var(--dim); }
</style>
</head>
<body>
<canvas id="screen" width="800" height="600"></canvas>
<div id="panel">
<header><b>Need for Speed Underground</b><span class="dim">Speed.exe traducido a WebAssembly · F2 cierra</span><span id="status">cargando…</span></header>
<pre id="log"></pre>
</div>
<script src="launcher_opts.js"></script>
<script>
// ?fast=1 without go=1 (opened by hand, not from the launcher's "Jugar"): the launcher is the entry point.
{ const p = new URLSearchParams(location.search); if (p.get('fast') === '1' && p.get('go') !== '1') location.replace('/launcher'); }
// Bare / with a saved choice (web/overlay.js, the launcher): play with its keys; web/mode.js reads the mode from storage itself.
if (!location.search) { const q = RN_LAUNCH.query(RN_LAUNCH.load()).split('&').filter(x => x !== 'play=1' && !x.startsWith('mode=')).join('&'); if (q && localStorage.getItem('rn_launch')) location.replace('/?' + q); }
</script>
<script src="mode.js"></script>
<script src="app.js"></script>
<script src="gpu.js"></script>
<script src="ug2/ug2world.js"></script>
<script src="gps/map.js"></script>
<script src="gps/tp.js"></script>
<script src="gps/route.js"></script>
<script src="input.js"></script>
<script src="binds.js"></script>
<script src="pad.js"></script>
<script src="touch.js"></script>
<script src="audio.js"></script>
<script src="telemetry.js"></script>
<script src="tune.js"></script>
<script>
// ?bridge[=url]: a race chosen in this menu opens in the NFSU1-RE engine instead (host/bridge.c). Off by default.
const bridgeTo = RN_Q.get('bridge');
if (bridgeTo !== null) window.rnBridge = q => { location.href = (bridgeTo && bridgeTo !== '1' ? bridgeTo : `http://${location.hostname}:5190/`) + '?' + q; return 1; };
</script>
<script src="out/speed.js"></script>
<script src="saves.js"></script>
<script>
// ?fast=1&go=1 (the launcher's "Jugar"): the launcher's 3D scene (web/launcher_b/?curtain=1, frozen at the end of its push-in) covers the game while it boots
// (no intro movies or splash, PATCH 0x4de395; the game's own Accept loads the profile, web/boot.js). It is only a loading curtain: it fades out in 250 ms
// when RN_APP leaves 'load' (web/app.js: the main menu is up, or a stop that must show). Opened without go=1 (set at the top of this page) it never gets here.
if (RN_Q.get('fast') === '1') {
  const css = document.createElement('style');
  css.textContent = `#ab { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 12; background: #05080d; pointer-events: none; transition: opacity .25s ease; }
    @media (prefers-reduced-motion: reduce) { #ab { transition: none; } }`;
  document.head.appendChild(css);
  const ab = Object.assign(document.createElement('iframe'), { id: 'ab', src: '/launcher_b/?curtain=1', tabIndex: -1 });
  document.body.append(ab);
  // The WASM boot waits (web/boot.js awaits RN_HOLD) until the scene has drawn its first frame (RN_B.ready, same origin) or 1.5 s: the game's boot would starve it (GPU, main thread).
  const t0b = performance.now();
  window.RN_HOLD = new Promise(res => { const f = () => { if (ab.contentWindow?.RN_B?.ready || performance.now() - t0b > 1500) { window.RN_AB_MS = Math.round(performance.now() - t0b); res(); } else setTimeout(f, 40); }; f(); });
  RN_APP.on(s => {
    if (s === 'load' || !ab.isConnected || ab.style.opacity === '0') return;
    ab.style.opacity = '0';
    setTimeout(() => { ab.remove(); document.getElementById('screen').focus(); }, 260);
  });
}
</script>
<script src="boot.js"></script>
<script src="overlay.js"></script>

</body>
</html>
