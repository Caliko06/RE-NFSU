<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070e23">
<meta name="robots" content="noindex">
<title>Underground · Scene B</title>
<style>
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#070e23; }
  #scene { position:fixed; inset:0; display:block; width:100%; height:100%; }
  #status { position:fixed; left:28px; bottom:24px; margin:0; color:#a9c9c5; font:11px/1.5 monospace; letter-spacing:.12em; }
  #status[hidden] { display:none; }
</style>
<canvas id="scene" aria-label="Nissan Skyline parked on a rain-wet street at night"></canvas>
<p id="status" role="status">LOADING SKYLINE</p>
<script type="module">
  // Standalone page and iframe host. ?shot=<hero|low|side|rear|detail> jumps to a shot with no intro; ?curtain=1 = loading curtain
  // (end pose of the launch move, frozen once the first frames are drawn). The status line is optional.
  import './scene.js';
  const status = () => document.querySelector('#status');
  RN_SCENE.start(document.querySelector('#scene'), {}).then(
    () => { const el = status(); if (el) el.hidden = true; },
    error => { const el = status(); if (el) { el.hidden = false; el.textContent = `SCENE B · ${error.message}`; } });
</script>
</html>
