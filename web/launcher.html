<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0e17">
<title>Need for Speed Underground</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="launcher.css">
</head>
<body data-screen="main" class="boot">
<!-- Scene: web/launcher_gl.js draws into #scene. .plate is the still image shown if WebGL is missing or has not started. -->
<div class="plate" aria-hidden="true"></div>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="shade" aria-hidden="true"></div>

<div class="ui" id="ui">
  <header class="brand panel" data-in>
    <h1 class="logo"><img src="launcher/v2/ui/logo.webp" alt="Need for Speed Underground" width="688" height="125"><span class="sm" aria-hidden="true"><i class="sweep"></i></span></h1>
  </header>

  <div class="tools" data-in>
    <button class="tool" id="btnSnd" type="button" aria-pressed="true" aria-label="Sonido (M)" title="Sonido (M)">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path class="spk" d="M4 9.5v5h3.6L13 19V5L7.6 9.5z"/><path class="wv" d="M16 8.6c1.6 1.9 1.6 4.9 0 6.8M18.6 6c3 3.3 3 8.7 0 12"/><path class="xx" d="M16 9l6 6M22 9l-6 6"/></svg>
    </button>
    <button class="tool pill" id="btnMot" type="button" aria-pressed="true" title="Animación"><i class="dot" aria-hidden="true"></i><span class="ml">Animación: sí</span></button>
  </div>

  <main class="stage">
    <section class="screen" id="s-main" aria-label="Menú principal">
      <div class="panel menu-panel" data-in>
        <nav class="list" id="menu" aria-label="Menú">
          <i class="light" aria-hidden="true"></i>
          <button class="item" id="play" type="button" data-desc="play"><span class="t">Jugar</span></button>
          <button class="item" type="button" data-go="presets" data-desc="Tres maneras de correr."><span class="t">Perfiles</span></button>
          <button class="item" type="button" data-go="opts" data-desc="Imagen, cámara y audio."><span class="t">Opciones</span></button>
          <button class="item" type="button" data-go="ctrl" data-desc="Teclado, mando y táctil."><span class="t">Controles</span></button>
        </nav>
        <p class="desc" aria-live="polite"><span class="dl"></span></p>
      </div>
    </section>

    <section class="screen" id="s-presets" aria-label="Perfiles" hidden>
      <h2 class="head" data-in><span class="t">Perfiles</span></h2>
      <div class="covers" id="covers" role="radiogroup" aria-label="Perfil"></div>
      <p class="line" id="presetLine" data-in aria-live="polite"><span class="dl"></span></p>
    </section>

    <section class="screen" id="s-opts" aria-label="Opciones" hidden>
      <div class="panel opts-panel" data-in>
        <div class="tabbar" data-in>
          <button class="bump" type="button" data-tab="-1" aria-label="Grupo anterior"></button>
          <div class="tabs" id="tabs" role="tablist" aria-label="Grupos de opciones"><i class="tabline" aria-hidden="true"></i></div>
          <button class="bump" type="button" data-tab="1" aria-label="Grupo siguiente"></button>
        </div>
        <div class="rows" id="optList"><i class="light" aria-hidden="true"></i></div>
        <p class="desc" aria-live="polite"><span class="dl"></span></p>
      </div>
    </section>

    <section class="screen" id="s-ctrl" aria-label="Controles" hidden>
      <div class="panel ctrl-panel" data-in>
        <div class="ctrl" id="ctrlGrid"></div>
        <nav class="list one" id="ctrlList" aria-label="Controles"><i class="light" aria-hidden="true"></i>
          <button class="item" type="button" data-back="1" data-desc="Reasignables con K en el juego."><span class="t">Volver</span></button>
        </nav>
        <p class="desc" aria-live="polite"><span class="dl"></span></p>
      </div>
    </section>
  </main>

  <footer class="keys" id="keysBar" data-in><div class="keysin" id="keys"></div></footer>
</div>

<div class="fade" id="fade" aria-hidden="true"></div>

<script src="launcher_opts.js"></script>
<script src="launcher_audio.js"></script>
<script src="launcher_gl.js"></script>
<script src="launcher.js"></script>
</body>
</html>
