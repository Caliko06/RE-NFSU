<link rel="stylesheet" href="launcher.css">

<body class="boot">
<!-- Scene: web/launcher_b/scene.js draws the 3D street (PlayCanvas, the game's own assets) into #scene. .plate is a CSS gradient shown if the scene fails. -->
<div class="plate" aria-hidden="true"></div>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="shade" aria-hidden="true"></div>

<!-- The launcher is one more screen of the game (OWNER 2026-11-15 night): the menus' own panel, font, selection bar and key hints.
     Screen A = main menu (JUGAR first, the few options); screen B = Opciones (one group at a time, like the game's browsers). -->
<div class="ui" id="ui">
  <aside class="panel" id="board" data-in aria-label="Menu">
    <header class="head">
      <h1 class="logo"><img src="launcher/v2/ui/logo.webp" alt="Need for Speed Underground" width="688" height="125"></h1>
      <p class="rig" id="rig"><b>Your machine</b><span id="rigName">measuring</span></p>
    </header>

    <div class="sheet" id="sheetA">
      <h2 class="title" id="titleA"></h2>
      <div class="rows" id="simple">
        <button class="item go nav" id="play" type="button" aria-label="Play"></button>
      </div>
      <button class="item nav" id="more" type="button"></button>
      <!-- a real link, so search engines follow it to the guides (web/blog/, tools/build_blog.py); launcher.js sets its language -->
      <a class="item nav" id="guides" href="blog/en/index.html" aria-label="Guides"></a>
    </div>
    <div class="sheet adv" id="sheetB" hidden>
      <div class="browse">
        <button class="arr l" id="tabPrev" type="button" tabindex="-1" aria-label="Previous group"></button>
        <div class="tabs" id="tabs" role="tablist" aria-label="Setting groups"></div>
        <button class="arr r" id="tabNext" type="button" tabindex="-1" aria-label="Next group"></button>
      </div>
      <p class="count" id="tabCount"></p>
      <div class="rows" id="adv"></div>
      <button class="item nav" id="less" type="button"></button>
    </div>

    <p class="help" id="help" aria-live="polite"><span class="dl"></span></p>
    <footer class="keys" id="keysBar"><div class="keysin" id="keys"></div></footer>
  </aside>

  <div class="tools" data-in>
    <button class="tool" id="btnSnd" type="button" aria-pressed="true" title="Menu sound (M)"><kbd>M</kbd><span class="sl">Sound: on</span></button>
    <button class="tool" id="btnMot" type="button" aria-pressed="true" title="Motion"><i class="dot" aria-hidden="true"></i><span class="ml">Motion: on</span></button>
  </div>
  <input id="fileRes" type="file" accept=".json,application/json" hidden>
</div>

<div class="fade" id="fade" aria-hidden="true"></div>

<script src="i18n.js"></script>
<script src="saves.js"></script>
<script src="launcher_opts.js"></script>
<script src="launcher_audio.js"></script>
<script src="dik.js"></script>
<script src="binds.js"></script>
<!-- launcher.js before the scene: modules run in order, and scene.js waits for PlayCanvas (830 KB); the menu must not (2026-11-17) -->
<script type="module" src="launcher.js"></script>
<script type="module" src="launcher_b/scene.js"></script>
</body>
