<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#151a21">
<title>Need for Speed Underground</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="launcher/vendor/fonts/barlow-condensed.css">
<link rel="stylesheet" href="launcher.css">
<script type="importmap">{"imports":{"three":"./launcher/vendor/three/build/three.module.js","three/addons/":"./launcher/vendor/three/examples/jsm/","@sparkjsdev/spark":"./launcher/vendor/spark/spark.module.min.js","postprocessing":"./launcher/vendor/postprocessing/postprocessing.js"}}</script>

<body data-screen="main">
<div class="plate" aria-hidden="true"></div>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="shade" aria-hidden="true"></div>
<div class="ui" id="ui">
  <header class="brand">
    <p class="eyebrow">Tu noche empieza aquí</p>
    <h1><span>Need for Speed</span><strong>Underground</strong></h1>
  </header>
  <p class="mode-label" id="modeLabel">Original 2003</p>
  <main>
    <nav class="menu" id="menu" aria-label="Menú principal">
      <span id="underline" aria-hidden="true"></span>
      <button id="play" type="button">Entrar a la calle <span aria-hidden="true">→</span></button>
      <button id="profileMenu" type="button" data-panel="profiles">Perfil</button>
      <button type="button" data-panel="options">Opciones</button>
      <button type="button" data-panel="controls">Controles</button>
    </nav>
    <section class="utility" id="panel" aria-labelledby="panelTitle" hidden>
      <header class="panel-head"><h2 id="panelTitle"></h2><button id="back" type="button">← Volver</button></header>
      <div id="panelContent"></div>
    </section>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <footer><span id="hints">↑ ↓ Elegir　↵ Entrar　Esc Volver</span><span class="edition">PC · 2003　 01 / After Hours</span></footer>
</div>
<div class="fade" id="fade" aria-hidden="true"></div>
<script src="launcher/vendor/gsap/gsap.min.js"></script>
<script src="launcher/vendor/gsap/CustomEase.min.js"></script>
<script src="launcher_opts.js"></script>
<script src="input.js"></script>
<!-- Register launcher capture before the game's bindings overlay listeners. -->
<script src="launcher_ui.js"></script>
<script src="binds.js"></script>
<script src="pad.js"></script>
<script type="module" src="launcher_world.js"></script>
<script type="module" src="launcher.js"></script>
</body>
</html>
