<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070808">
<title>Need for Speed Underground</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="launcher.css">
</head>
<body class="boot">
<!-- Scene: web/launcher_b/scene.js draws the 3D street (PlayCanvas, the game's own assets) into #scene. .plate is a CSS gradient shown if the scene fails. -->
<div class="plate" aria-hidden="true"></div>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="shade" aria-hidden="true"></div>

<div class="ui" id="ui">
  <header class="brand" data-in>
    <h1 class="logo"><img src="launcher/v2/ui/logo.webp" alt="Need for Speed Underground" width="688" height="125"></h1>
  </header>

  <div class="tools" data-in>
    <button class="tool" id="btnSnd" type="button" aria-pressed="true" aria-label="Sonido del menú (M)" title="Sonido del menú (M)">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path class="spk" d="M4 9.5v5h3.6L13 19V5L7.6 9.5z"/><path class="wv" d="M16 8.6c1.6 1.9 1.6 4.9 0 6.8M18.6 6c3 3.3 3 8.7 0 12"/><path class="xx" d="M16 9l6 6M22 9l-6 6"/></svg>
    </button>
    <button class="tool pill" id="btnMot" type="button" aria-pressed="true" title="Animación"><i class="dot" aria-hidden="true"></i><span class="ml">Animación: sí</span></button>
  </div>

  <!-- left: the one thing a newcomer needs -->
  <section class="hero" data-in aria-label="Jugar">
    <button class="go nav" id="play" type="button" aria-label="Jugar"><img class="art" src="launcher/v6/jugar.webp" alt="" width="1300" height="444" draggable="false"></button>
    <p class="what" id="what" aria-live="polite"></p>
  </section>

  <!-- right: the settings board. Sheet A = the few options; sheet B (Avanzado) = every option by group. -->
  <aside class="board" id="board" data-in aria-label="Ajustes">
    <img class="bg" src="launcher/v7/board.webp" alt="" draggable="false">
    <div class="sheet" id="sheetA">
      <div class="rig" id="rig"><img class="bg" src="launcher/v7/sticker.webp" alt="" draggable="false"><b>Tu equipo</b><span id="rigName">midiendo</span></div>
      <div class="rows" id="simple"></div>
      <button class="tab nav" id="more" type="button"><img class="bg" src="launcher/v7/tab.webp" alt="" draggable="false"><span>Avanzado</span></button>
    </div>
    <div class="sheet adv" id="sheetB" hidden>
      <div class="tabs" id="tabs" role="tablist" aria-label="Grupos de ajustes"></div>
      <div class="rows" id="adv"></div>
      <button class="tab nav" id="less" type="button"><img class="bg" src="launcher/v7/tab.webp" alt="" draggable="false"><span>Básico</span></button>
    </div>
  </aside>

  <!-- what the selected option does: one line, and two real captures when there are any -->
  <div class="ba" id="ba" hidden aria-hidden="true">
    <figure><img class="pic" id="baA" alt=""><figcaption id="baAt"></figcaption></figure>
    <figure><img class="pic" id="baB" alt=""><figcaption id="baBt"></figcaption></figure>
  </div>
  <p class="help" id="help" data-in aria-live="polite"><span class="dl"></span></p>

  <footer class="keys" id="keysBar" data-in><div class="keysin" id="keys"></div></footer>
  <input id="fileRes" type="file" accept=".json,application/json" hidden>
</div>

<div class="fade" id="fade" aria-hidden="true"></div>

<script src="saves.js"></script>
<script src="launcher_opts.js"></script>
<script src="launcher_audio.js"></script>
<script src="dik.js"></script>
<script src="binds.js"></script>
<script type="module" src="launcher_b/scene.js"></script>
<script type="module" src="launcher.js"></script>
</body>
</html>
